[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13,<0.14" ]

[project]
name = "dbrix"
version = "0.2.0"
description = "PySpark helpers for Databricks"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Mykola Bezrukyi" } ]
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka[schemaregistry]",
  "databricks-sdk",
  "paramiko",
]
